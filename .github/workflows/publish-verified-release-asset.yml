name: Publish verified release asset
run-name: Publish ${{ inputs.filename }} as an Actions artifact

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag containing the source asset
        required: true
        type: string
      filename:
        description: Exact ZIP filename in the release
        required: true
        type: string
      expected_sha256:
        description: Expected lowercase SHA-256 of the ZIP
        required: true
        type: string
      expected_size:
        description: Expected byte size of the ZIP
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: transfer-${{ inputs.filename }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify release asset
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          FILENAME: ${{ inputs.filename }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          EXPECTED_SIZE: ${{ inputs.expected_size }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid release tag"; exit 1; }
          [[ "$FILENAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.zip$ ]] || { echo "::error::Invalid ZIP filename"; exit 1; }
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Invalid SHA-256"; exit 1; }
          [[ "$EXPECTED_SIZE" =~ ^[0-9]+$ ]] || { echo "::error::Invalid byte size"; exit 1; }

          mkdir -p payload
          destination="payload/$FILENAME"
          source_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${FILENAME}"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 5 --retry-all-errors --connect-timeout 10 --max-time 180 \
            --output "$destination" "$source_url"

          actual_size="$(stat --printf='%s' "$destination")"
          actual_sha256="$(sha256sum "$destination" | awk '{print $1}')"
          [[ "$actual_size" == "$EXPECTED_SIZE" ]] || { echo "::error::Size mismatch: $actual_size"; exit 1; }
          [[ "$actual_sha256" == "$EXPECTED_SHA256" ]] || { echo "::error::SHA-256 mismatch: $actual_sha256"; exit 1; }
          unzip -tq "$destination"
          chmod 0400 "$destination"

      - name: Upload exact ZIP as unarchived Actions artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: payload/${{ inputs.filename }}
          if-no-files-found: error
          retention-days: 1
          archive: false

      - name: Record artifact identifiers
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          {
            echo "### Verified transfer artifact"
            echo "- Artifact ID: ${ARTIFACT_ID}"
            echo "- Artifact URL: ${ARTIFACT_URL}"
            echo "- Artifact digest: ${ARTIFACT_DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
